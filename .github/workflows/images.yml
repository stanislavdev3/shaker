name: Container images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: shaker-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: app-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/shaker
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: app-build
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: docker/metadata-action@v5
        id: migrate-meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/shaker-migrate
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: migrate-build
        with:
          context: .
          file: Dockerfile.migrate
          platforms: linux/arm64
          push: true
          tags: ${{ steps.migrate-meta.outputs.tags }}
          labels: ${{ steps.migrate-meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Check out GitOps repository
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          repository: stanislavdev3/automatic-eureka
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Install Kustomize
        if: startsWith(github.ref, 'refs/tags/v')
        uses: imranismail/setup-kustomize@v2
      - name: Pin release image digests
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: gitops/kubernetes/apps/shaker
        env:
          APP_DIGEST: ${{ steps.app-build.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate-build.outputs.digest }}
        run: |
          kustomize edit set image \
            ghcr.io/stanislavdev3/shaker=ghcr.io/stanislavdev3/shaker@${APP_DIGEST} \
            ghcr.io/stanislavdev3/shaker-migrate=ghcr.io/stanislavdev3/shaker-migrate@${MIGRATE_DIGEST}
      - name: Publish GitOps release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: gitops
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kubernetes/apps/shaker/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Deploy Shaker ${RELEASE_TAG}"
          git pull --rebase origin master
          git push origin HEAD:master
