name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: earthquake
          POSTGRES_PASSWORD: earthquake
          POSTGRES_DB: earthquake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U earthquake -d earthquake_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://earthquake:earthquake@localhost:5432/earthquake_test?sslmode=disable
      GOCACHE: /tmp/go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build # embedded by the Go build below
        working-directory: web
      - uses: actions/setup-go@v5
        with: {go-version: "1.26.2", cache: true}
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with: {version: v2.1.6}
      - run: go test -race ./...
      - run: go build ./cmd/earthquake-service
      - run: for migration in migrations/*.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - run: go test -tags=integration ./internal/repository/postgres
      - uses: docker://redocly/cli:1.34.5
        with: lint api/openapi.yaml
      - run: docker build .
